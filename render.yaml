# Render 藍圖
#
# 用法：Render 後台 → New → Blueprint → 選這個 repo → Apply
#
# 為什麼用 Render 而不是 Vercel：這個專案的寫入鎖與快取都在單一 Node 程序的
# 記憶體裡，需要「一個長駐實例」，而不是會自動水平擴展的 serverless 環境。
services:
  - type: web
    name: jiuye-yanglao
    runtime: node
    plan: free
    # 新加坡機房，台灣連線延遲最低
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # 這支端點會回報憑證有沒有吃到，部署後可直接打開檢查
    healthCheckPath: /api/health
    envVars:
      # sync: false = 值不寫在 repo 裡，部署後到 Render 後台手動填
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # 線上主持（瘋兔子）的線索來源。沒設時用舊的 publishable key，
      # 關掉 cards 表的匿名讀取後就必須設 secret key，見 tools/online/supabase_schema.sql
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
